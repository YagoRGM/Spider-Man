<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | {% block titulo %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/aranha.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ===== NAVBAR RESPONSIVA ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <svg class="spider-icon" viewBox="0 0 64 64" aria-hidden="true">
                    <g fill="currentColor">
                        <ellipse cx="32" cy="38" rx="10" ry="13"/>
                        <circle cx="32" cy="21" r="7"/>
                    </g>
                    <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">
                        <path d="M24 30 8 18"/>
                        <path d="M22 36 4 32"/>
                        <path d="M22 42 6 46"/>
                        <path d="M24 48 10 58"/>
                        <path d="M40 30 56 18"/>
                        <path d="M42 36 60 32"/>
                        <path d="M42 42 58 46"/>
                        <path d="M40 48 54 58"/>
                    </g>
                </svg> Spider-Man
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'home' %}active{% endif %}" {% if active == 'home' %}aria-current="page"{% endif %} href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'sobre' %}active{% endif %}" {% if active == 'sobre' %}aria-current="page"{% endif %} href="{{ url_for('sobre') }}">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'contato' %}active{% endif %}" {% if active == 'contato' %}aria-current="page"{% endif %} href="{{ url_for('contato') }}">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra %}{% endblock %}

    <footer class="text-center text-white py-4">
        <p class="mb-1">&copy; 2026 Spider-Man Fan Page</p>
        <p class="mb-0 small">Projeto acadêmico — Desenvolvimento Web Semântico - Yago Moraes</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
