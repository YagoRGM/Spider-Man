<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        
        <div class="logo">
            <span class="logo-icone">🕸️</span>
            <span class="logo-texto">Spider-Man</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="intro-contato">
            <h1>Entre em contato</h1>
            <p>
                Tem alguma sugestão, dúvida ou quer compartilhar algo sobre o
                universo do Homem-Aranha? Envie uma mensagem.
            </p>
        </section>

        <section class="secao-formulario">
            <form action="#" method="post">

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem" required></textarea>
                </div>

                <button type="submit">Enviar mensagem</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Spider-Man Fan Page</p>
        <p>Projeto acadêmico — Desenvolvimento Web Semântico - Yago Moraes</p>
    </footer>

</body>
</html>
